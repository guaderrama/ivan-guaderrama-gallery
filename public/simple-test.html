<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple React Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
        }
    }
    </script>

    <script type="module">
        import React from 'react';
        import ReactDOM from 'react-dom/client';

        const { createElement: h, useState } = React;

        function SimpleApp() {
            const [message, setMessage] = useState('React está funcionando!');

            return h('div', {
                className: 'min-h-screen bg-white flex items-center justify-center p-4'
            },
                h('div', { className: 'max-w-md w-full text-center' },
                    h('h1', { className: 'text-3xl font-black mb-4' }, 'IVAN GUADERRAMA'),
                    h('p', { className: 'text-gray-500 mb-8' }, 'ART GALLERY'),
                    h('div', { className: 'bg-green-100 border border-green-500 p-4 rounded mb-4' },
                        h('p', { className: 'text-green-800 font-bold' }, message)
                    ),
                    h('button', {
                        className: 'bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600',
                        onClick: () => setMessage('✅ React hooks funcionan!')
                    }, 'Probar onClick')
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(SimpleApp));

        console.log('✅ React renderizado exitosamente');
    </script>
</body>
</html>
